[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "raft-traces"
version = "0.1.0"
description = "Evidence-backed analysis for piles of LLM traces"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "numpy>=2.0,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6.0,<7",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2"]
ml = ["sentence-transformers>=5.0,<6"]

[tool.hatch.build.targets.wheel]
packages = ["raft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

