services:
  raft:
    build: .
    ports:
      - "${RAFT_HOST_PORT:-8010}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      RAFT_DATABASE_PATH: /data/raft.db
      RAFT_MODEL_ROLES_PATH: /app/model-roles.yaml
      RAFT_WEB_DIST_PATH: /app/web/dist
    volumes:
      - raft-data:/data
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [raft]
    restart: unless-stopped

volumes:
  raft-data:
